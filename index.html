<!doctype html>

<head>
<meta charset="utf-8">

<meta name="author" content="キノメノ / Kinomeno">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ほりほり工場">

<meta property="og:url" content="https://horihori.kinomeno.com/">
<link rel="canonical" href="https://horihori.kinomeno.com/">

<meta property="og:image:width" content="1200">

<meta property="og:locale" content="ja_JP">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=2.06">

</head>
<body>
<canvas id="cv"></canvas>

<!-- ヘッダー（半透明。下にゲーム画面が透ける） -->
<header id="hdr">
  <div class="hrow">
    <span class="brand"><b class="title" data-t="title">ほりほり工場</b><span class="wm">DIG FACTORY</span><small id="ver"></small></span>
    <span class="stat" id="date"></span>
    <span class="grow"></span>
    <button id="infoBtn"><span class="lg" data-t="info">情報</span><span class="sm">i</span></button>
    <button id="colBtn" class="icon" aria-label="collection"><svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1" opacity=".35"/></svg></button>
    <button id="helpBtn"><span class="lg" data-t="help">遊び方</span><span class="sm">?</span></button>
    <button id="adminBtn" class="test"><span class="lg" data-t="admin">管理</span><span class="sm">管</span></button>
    <button id="setBtn" class="icon" aria-label="settings"><svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M13.05 6.76 L14.90 6.82 L14.90 9.18 L13.05 9.24 L12.45 10.70 L13.72 12.04 L12.04 13.72 L10.70 12.45 L9.24 13.05 L9.18 14.90 L6.82 14.90 L6.76 13.05 L5.30 12.45 L3.96 13.72 L2.28 12.04 L3.55 10.70 L2.95 9.24 L1.10 9.18 L1.10 6.82 L2.95 6.76 L3.55 5.30 L2.28 3.96 L3.96 2.28 L5.30 3.55 L6.76 2.95 L6.82 1.10 L9.18 1.10 L9.24 2.95 L10.70 3.55 L12.04 2.28 L13.72 3.96 L12.45 5.30 Z M10.3 8 A2.3 2.3 0 1 0 5.7 8 A2.3 2.3 0 1 0 10.3 8 Z"/></svg></button>
    <button id="hideBtn" class="icon" aria-label="hide"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2H14v4.5M14 2L9 7M6.5 14H2V9.5M2 14l5-5"/></svg></button>
  </div>
  <!-- 2段目：時間・空間の操作（手のひら・停止・速さ・拡大縮小・地上・地図） -->
  <div class="hrow" id="timeGroup">
  <button class="tool hand" data-tool="pan" id="panBtn" aria-label="move"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5V4a1.5 1.5 0 0 1 3 0v7.5"/><path d="M14 11.5V5.5a1.5 1.5 0 0 1 3 0V13"/><path d="M17 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1.5a6 6 0 0 1-4.6-2.2L3.6 15.6a1.6 1.6 0 0 1 2.4-2.1L8 15.5"/></svg></button>
  <span class="sep"></span>
  <button id="playBtn" class="play"></button>
  <button id="speedBtn">×1</button>
  <span id="liveBar" hidden><button id="live10" data-t="live10">+10分</button><button id="live60" data-t="live60">+60分</button></span>
  <span class="sep"></span>
  <span class="lab zl" data-t="zoom">ズーム</span>
  <button id="zoomOut" class="sq">－</button>
  <button id="zoomIn" class="sq">＋</button>
  <button id="topBtn" data-t="top">地上</button>
  <button id="mapBtn" data-t="map">地図</button>
  <span class="grow"></span>
  <button id="foldBtn" class="fold" aria-label="fold">▴&#xFE0E;</button>
  </div>
</header>

<!-- ヘッダー2段目を畳んだときの、引き出すつまみ（ヘッダーの下に垂れる） -->
<button id="unhideBtn" aria-label="show" hidden><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 6.5H9.5V2.5M9.5 6.5L14 2M2.5 9.5h4v4M6.5 9.5L2 14"/></svg></button>
<button id="unfoldBtn" class="fold" aria-label="unfold" hidden>▾&#xFE0E;</button>

<!-- 移動：画面の端の帯を押している間、画面が動く（ボタンの絵は小さいまま） -->

<!-- 全体の縮小地図（見出しをドラッグで移動。地図をタップでその場所へ） -->
<div id="mapPanel" class="float drag" hidden>
  <div class="head handle"><b data-t="map">地図</b><button class="x" data-close="mapPanel">✕</button></div>
  <canvas id="mapCv" width="120" height="240"></canvas>
</div>

<!-- 向き（コンベア・仕分け・機械を置くとき） -->
<div id="dirBar" class="float group">
  <span class="lab" data-t="dir">向き</span>
  <button class="dir" data-dir="auto" data-t="autoDirB">オート</button>
  <button class="dir" data-dir="left">←</button>
  <button class="dir" data-dir="up">↑</button>
  <button class="dir" data-dir="down">↓</button>
  <button class="dir" data-dir="right">→</button>
</div>

<!-- 下のメニュー：「メニュー」で開く → 項目をタップするとさらに上に展開 -->
<div id="subMenu" class="float group" hidden></div>
<div id="catBar" class="float group" hidden>
  <button class="cat" data-cat="build" data-t="build">設置</button>
  <button class="cat" data-cat="facility" id="facBtn" data-t="facility">施設</button>
  <button id="skillBtn" data-t="skill">スキル</button>
  <button id="powerBtn" data-t="power">強化</button>
  <button id="tradeBtn" data-t="trade">取引</button>
  <button class="cat" data-cat="infoCat" data-t="info">情報</button>
  <button id="menuClose" class="x">✕</button>
</div>
<button id="menuBtn" class="float"><span data-t="menu">メニュー</span><span id="menuCur"></span></button>

<!-- 試験：下のタブ（書類フォルダの見出しのように並ぶ。押すと、その上に引き出しが伸びる） -->
<div id="dash" hidden>
  <button class="dtab" data-px="#catBar [data-cat=build]" data-open="build"><b data-t="build">設置</b><i>BUILD</i></button>
  <button class="dtab" data-px="facBtn" data-open="facility"><b data-t="facility">施設</b><i>FACILITY</i></button>
  <button class="dtab" data-px="skillBtn" data-open="skillPanel"><b data-t="skill">スキル</b><i>RESEARCH</i></button>
  <button class="dtab" data-px="powerBtn" data-open="powerPanel"><b data-t="power">強化</b><i>UPGRADE</i></button>
  <button class="dtab" data-px="#catBar [data-cat=infoCat]" data-open="infoCat"><b data-t="info">情報</b><i>REPORT</i></button>
  <button class="dtab" data-px="tradeBtn" data-open="tradePanel"><b data-t="trade">取引</b><i>DEALS</i></button>
</div>
<!-- 引き出しの取っ手（開いている引き出しの左上に付く） -->
<div id="dHandle" hidden><b></b><i></i></div>
<!-- 引き出しを閉じる（右上の×） -->
<button id="dClose" class="x" aria-label="close" hidden><svg viewBox="0 0 16 10" width="16" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l6 6 6-6"/></svg></button>

<!-- 資金：ゲーム画面の左上に直接（白いふちで、どんな背景でも読める） -->
<div id="fpsHud"></div>
<div id="cmBox" hidden></div>
<div id="cutBub" hidden></div>
<div id="tutGoal" hidden></div>
<!-- 解放された物（絵と名前。タップで閉じる） -->
<div id="unlockCard" hidden><div class="ulHead"><canvas id="unlockFace"></canvas><b id="unlockTitle"></b><button class="ulX" aria-label="close">✕</button></div><div id="unlockList"></div></div>
<!-- 秘書の提案（研究すると右下に顔。×で小さく灰色に） -->
<div id="secAdv" hidden><canvas id="secAdvFace"></canvas><b id="secAdvN" hidden></b><button id="secAdvX" aria-label="minimize">×</button></div>
<div id="secAdvBub" hidden><span id="secAdvT"></span><span class="advBtns"><button id="secAdvOk"></button><button id="secAdvNext"></button></span></div>
<div id="moneyHud"><i class="mfold">▽</i><span data-t="money">資金</span><b id="money">0</b><small id="goalHud"></small><small id="monthHud"></small><small id="boostHud"></small><small id="aiTime"></small><small id="aiHud"></small></div>

<p id="msg" class="msg"></p>
<div id="tutMsg" hidden><span id="tutText"></span><button id="tutNext" type="button" hidden aria-label="next">▼</button><button id="tutOk" type="button" hidden>OK</button><button id="tutX" type="button" hidden aria-label="close">✕</button></div>
<span id="tutDots" hidden></span><button id="tutSkip" data-t="tutSkipB" hidden>スキップ</button>
<svg id="tutArrow" hidden></svg>
<!-- 選択中の道具（左下） -->
<div id="curTool" class="float" hidden></div>

<!-- 強化 -->
<div id="powerPanel" class="float panel bottom" hidden>
  <div class="head"><b data-t="power">強化</b><button class="x" data-close="powerPanel">✕</button></div>
  <div id="powerItems"></div>
</div>

<!-- 取引（CMを見ると特典。今はCMの代わりに数秒待つ仮の形） -->
<div id="tradePanel" class="float panel bottom" hidden>
  <div class="head"><b data-t="trade">取引</b><button class="x" data-close="tradePanel">✕</button></div>
  <div id="tradeBody"></div>
</div>

<!-- スキル（研究） -->
<div id="skillPanel" class="float panel bottom" hidden>
  <div class="head"><b data-t="skill">スキル</b><button class="x" data-close="skillPanel">✕</button></div>
  <canvas id="labView" class="cutaway"></canvas>
  <div id="skillBody"></div>
</div>

<!-- 事務所 -->
<div id="office" class="float panel" hidden>
  <div class="head"><b data-t="office">事務所</b><button class="x" data-close="office">✕</button></div>
  <canvas id="officeView" class="cutaway"></canvas>
  <div id="officeBody"></div>
</div>

<!-- 情報（経営状況。見出しをドラッグで移動できる） -->
<div id="info" class="float panel drag" hidden>
  <div class="head handle"><b data-t="info">情報</b><button class="x" data-close="info">✕</button></div>
  <div class="itabs"><button data-itab="fin" class="active" data-t="finance">財務</button><button data-itab="hist" data-t="history">履歴</button><button data-itab="cat" data-t="catalog">カタログ</button></div>
  <div id="infoFin">
  <div id="infoData" class="igrid"></div>
  <div class="igraphs">
    <div class="igrp"><div class="ihead" data-t="gMoney">資金の動き</div><canvas id="gMoney" class="graph" width="340" height="90"></canvas></div>
    <div class="igrp"><div class="ihead" data-t="gMonth">月ごとの収支</div><canvas id="gMonth" class="graph" width="340" height="90"></canvas></div>
  </div>
  </div>
  <div id="infoHist" class="ihist" hidden></div>
  <div id="infoCatl" class="icat" hidden></div>
</div>

<!-- コレクション（見た物が格子に並ぶ） -->
<div id="colPanel" class="float panel" hidden>
  <div class="head"><b><span data-t="colTitle">コレクション</span>　<small id="colCount"></small></b><button class="x" data-close="colPanel">✕</button></div>
  <div id="colName" class="sub"></div>
  <div id="colBody"></div>
</div>

<!-- 遊び方 -->
<div id="help" class="float panel" hidden>
  <div class="head"><b data-t="help">遊び方</b><button class="x" data-close="help">✕</button></div>
  <div class="help2"><nav id="helpNav"></nav><div id="helpBody"></div></div>
  <div class="credit"></div>
</div>

<!-- 設定 -->
<div id="settings" class="float panel" hidden>
  <div class="head"><b data-t="settings">設定</b><button class="x" data-close="settings">✕</button></div>
  <div class="prow labeled"><span class="lab" data-t="lang">表示</span>
    <span class="opts">
      <button data-lang="hira">ひらがな</button><button data-lang="kanji">漢字</button><button data-lang="en">English</button>
    </span>
  </div>
  <div id="setExtra"></div>
  <button id="resetBtn" class="wide" data-t="reset">最初から</button>
  <div class="credit"></div>
</div>

<!-- テスト用 管理メニュー（開発中のみ。公開前に main.js の DEV=false） -->
<div id="admin" class="float panel" hidden>
  <div class="head"><b data-t="admin">管理</b><button class="x" data-close="admin">✕</button></div>
  <div id="adminBody" class="adminGrid"></div>
</div>

<!-- テスト用 調整（バーで数値を変える。結果をコピーしてチャットへ） -->
<div id="tune" class="float panel" hidden>
  <div class="head"><b data-t="tuneT">調整</b><button class="x" data-close="tune">✕</button></div>
  <div id="tuneBody"></div>
</div>

<!-- 置いた物をタップしたときのメニュー -->
<div id="pop" class="float" hidden>
  <div class="head"><span id="popTitle"></span><button id="popRemove" data-t="remove">撤去</button><button id="popClose" class="x">✕</button></div>
  <canvas id="popView" class="cutaway" hidden></canvas>
  <div id="popDirs" class="prow labeled"><span class="lab" data-t="dir">向き</span><span class="opts">
    <button data-pdir="left">←</button>
    <button data-pdir="up">↑</button>
    <button data-pdir="down">↓</button>
    <button data-pdir="right">→</button>
  </span></div>
  <div id="popFilterRow" class="prow labeled"><span class="lab" data-t="filter">選ぶ資源</span><span class="opts" id="popFilters"></span></div>
  <div id="popInvRow" class="prow labeled" hidden><span class="lab" data-t="sortInvL">出す物</span>
    <span class="opts"><button data-pinv="0" data-t="sortOnly">選んだ物のみ</button><button data-pinv="1" data-t="sortExcept">選んだ物以外</button></span>
  </div>
  <div id="popSideRow" class="prow labeled"><span class="lab" data-t="side">出す側</span>
    <span class="opts"><button data-ps="left" data-t="left">左</button><button data-ps="right" data-t="right">右</button></span>
  </div>
  <div id="popPrioRow" class="prow labeled"><span class="lab" data-t="prio">優先度</span>
    <span class="opts"><button data-pp="0" data-t="pLow">低</button><button data-pp="1" data-t="pMid">普通</button><button data-pp="2" data-t="pHigh">高</button></span>
  </div>
  <div id="popLevel" class="sub lvline"></div>
  <button id="popLvUp" class="wide"></button>
  <button id="popEject" class="wide" hidden></button>
  <button id="popAction" class="wide"></button>
  <div id="popInfo" class="sub"></div>
</div>

<!-- タイトル画面（下に地上、上はぜんぶ空） -->
<div id="title" hidden>
  <div class="tbox">
    <h1 class="tname" data-t="title">ほりほり工場</h1>
    <div class="tsub">DIG FACTORY TYCOON</div>
    <div class="tmenu">
      <button id="tCont" data-t="tCont">つづきから</button>
      <button id="tNew" data-t="tNew">はじめから</button>
      <button id="tHelp" data-t="help">遊び方</button>
    </div>
    <div class="tlang"><button data-lang="hira">ひらがな</button><button data-lang="kanji">漢字</button><button data-lang="en">English</button></div>
    <div class="tlinks"><a href="diary/" target="_blank" rel="noopener" data-t="diaryLink">制作日誌</a><button id="tHome" data-t="homeAdd">ホーム画面に追加</button></div>
    <div class="tfoot"><span id="tVer"></span>　© 2026 キノメノ / Kinomeno</div>
  </div>
</div>

<!-- CM（仮）：今は数秒待つだけ。広告サービスを入れる時はここに流す -->
<div id="homeBox" class="modal" hidden>
  <div class="box homeBox">
    <div class="hhead"><img src="icons/icon-192.png" alt="" width="48" height="48"><b data-t="homeAdd">ホーム画面に追加</b><button class="x" id="homeX" aria-label="close">✕</button></div>
    <p id="homeLead"></p>
    <ol id="homeSteps"></ol>
    <img id="homeImg" src="icons/ios-home-ja.jpg" alt="Safari の共有メニューの「ホーム画面に追加」" width="420" height="453" loading="lazy" hidden>
    <div class="btns"><button id="homeInstall" class="active" hidden></button><button id="homeOk">OK</button></div>
  </div>
</div>

<div id="adBox" class="modal" hidden>
  <div class="box">
    <p id="adMsg"></p>
    <div class="adScreen"><span data-t="adDummy">CM（準備中）</span></div>
    <div class="bar awaybar"><i id="adBar"></i></div>
  </div>
</div>

<!-- 留守の間の計算 -->
<div id="away" class="modal" hidden>
  <div class="box">
    <p id="awayMsg"></p>
    <div class="bar awaybar"><i id="awayBar"></i></div>
    <p id="awayEta"></p>
    <div class="btns"><button id="awayOk" class="active" hidden>OK</button></div>
  </div>
</div>

<!-- お知らせ（銀行の融資など） -->
<div id="notice" class="modal" hidden>
  <div class="box">
    <p id="noticeMsg"></p>
    <div class="btns"><button id="noticeOk" class="active">OK</button></div>
  </div>
</div>

<!-- 確認（ブラウザ標準の確認窓は使わない） -->
<div id="confirm" class="modal" hidden>
  <div class="box">
    <p id="confirmMsg"></p>
    <div class="btns"><button id="confirmNo" data-t="no">いいえ</button><button id="confirmYes" class="active" data-t="yes">はい</button></div>
  </div>
</div>

</body>
</html>
