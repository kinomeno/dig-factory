<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>採掘ゲーム</title>
<link rel="stylesheet" href="style.css?v=0.07">
</head>
<body>
<!-- ヘッダー -->
<header id="hdr">
  <b class="title" data-t="title">採掘ゲーム</b><small id="ver"></small>
  <span class="stat"><span data-t="money">資金</span> <b id="money">0</b></span>
  <span class="stat" id="date"></span>
  <span class="grow"></span>
  <button id="helpBtn" data-t="help">遊び方</button>
  <button id="setBtn" class="icon" aria-label="settings">⚙&#xFE0E;</button>
</header>

<canvas id="cv"></canvas>

<!-- 時間・表示の操作 -->
<div id="timeGroup" class="float group">
  <button id="playBtn" class="play"></button>
  <button id="speedBtn">×1</button>
  <span class="sep"></span>
  <button id="zoomOut" class="sq">－</button>
  <button id="zoomIn" class="sq">＋</button>
  <button id="topBtn" data-t="top">地上</button>
</div>

<!-- 画面を動かすボタン（押し続けると動き続ける） -->
<!-- それぞれ画面の端に置く（位置は main.js の layoutFloats で他のメニューと重ならないよう調整） -->
<button class="mv" id="mvUp" data-mv="up">▲&#xFE0E;</button>
<button class="mv" id="mvLeft" data-mv="left">◀&#xFE0E;</button>
<button class="mv" id="mvRight" data-mv="right">▶&#xFE0E;</button>
<button class="mv" id="mvDown" data-mv="down">▼&#xFE0E;</button>

<!-- 向き（コンベア・仕分け・機械を置くとき） -->
<div id="dirBar" class="float group">
  <span class="lab" data-t="dir">向き</span>
  <button class="dir" data-dir="left">←</button>
  <button class="dir" data-dir="up">↑</button>
  <button class="dir" data-dir="down">↓</button>
  <button class="dir" data-dir="right">→</button>
</div>

<!-- 道具 -->
<div id="toolBar" class="float group">
  <button class="tool hand" data-tool="pan" id="panBtn" aria-label="move"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5V4a1.5 1.5 0 0 1 3 0v7.5"/><path d="M14 11.5V5.5a1.5 1.5 0 0 1 3 0V13"/><path d="M17 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1.5a6 6 0 0 1-4.6-2.2L3.6 15.6a1.6 1.6 0 0 1 2.4-2.1L8 15.5"/></svg></button>
  <span class="sep"></span>
  <button class="tool" data-tool="drill"><span data-t="drill">ドリル</span> <small>50</small></button>
  <button class="tool" data-tool="dig" data-t="dig">掘削</button>
  <button class="tool" data-tool="conv"><span data-t="conv">コンベア</span> <small>5</small></button>
  <button class="tool" data-tool="sort"><span data-t="sort">仕分け</span> <small>20</small></button>
  <button class="tool" data-tool="machine" id="machBtn"><span id="machBtnLabel" data-t="machine">機械</span> ▾</button>
  <button class="tool" data-tool="remove" data-t="remove">撤去</button>
  <span class="sep"></span>
  <button id="powerBtn" data-t="power">強化</button>
</div>

<p id="msg" class="msg"></p>

<!-- 機械の一覧 -->
<div id="machList" class="float panel bottom" hidden>
  <div class="head"><b data-t="machine">機械</b><button class="x" data-close="machList">✕</button></div>
  <div id="machItems"></div>
</div>

<!-- 強化 -->
<div id="powerPanel" class="float panel bottom" hidden>
  <div class="head"><b data-t="power">強化</b><button class="x" data-close="powerPanel">✕</button></div>
  <div id="powerItems"></div>
</div>

<!-- 遊び方 -->
<div id="help" class="float panel" hidden>
  <div class="head"><b data-t="help">遊び方</b><button class="x" data-close="help">✕</button></div>
  <ul id="helpList"></ul>
  <div class="credit"></div>
</div>

<!-- 設定 -->
<div id="settings" class="float panel" hidden>
  <div class="head"><b data-t="settings">設定</b><button class="x" data-close="settings">✕</button></div>
  <div class="prow labeled"><span class="lab" data-t="lang">表示</span>
    <span class="opts">
      <button data-lang="hira">ひらがな</button><button data-lang="kanji">漢字</button><button data-lang="en">English</button>
    </span>
  </div>
  <button id="resetBtn" class="wide" data-t="reset">最初から</button>
  <!-- テスト用（公開前に外す） -->
  <button id="loanBtn" class="wide test" data-t="loan">テスト用：借り入れ ＋1000</button>
  <div class="credit"></div>
</div>

<!-- 置いた物をタップしたときのメニュー -->
<div id="pop" class="float" hidden>
  <div class="head"><span id="popTitle"></span><button id="popClose" class="x">✕</button></div>
  <div id="popDirs" class="prow">
    <button data-pdir="left">←</button>
    <button data-pdir="up">↑</button>
    <button data-pdir="down">↓</button>
    <button data-pdir="right">→</button>
  </div>
  <div id="popFilterRow" class="prow labeled"><span class="lab" data-t="filter">選ぶ資源</span><span class="opts" id="popFilters"></span></div>
  <div id="popSideRow" class="prow labeled"><span class="lab" data-t="side">出す側</span>
    <span class="opts"><button data-ps="left" data-t="left">左</button><button data-ps="right" data-t="right">右</button></span>
  </div>
  <div id="popInfo" class="sub"></div>
  <div id="popLevel" class="sub lvline"></div>
  <button id="popLvUp" class="wide"></button>
  <button id="popAction" class="wide"></button>
  <button id="popRemove" class="wide" data-t="remove">撤去</button>
</div>

<!-- 確認（ブラウザ標準の確認窓は使わない） -->
<div id="confirm" class="modal" hidden>
  <div class="box">
    <p id="confirmMsg"></p>
    <div class="btns"><button id="confirmNo" data-t="no">いいえ</button><button id="confirmYes" class="active" data-t="yes">はい</button></div>
  </div>
</div>

<script src="main.js?v=0.07"></script>
</body>
</html>
